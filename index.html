<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockTrader</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e7edf5;background:#0a1020}*{box-sizing:border-box}body{margin:0}.top{height:60px;background:#111a2d;border-bottom:1px solid #293750;display:flex;align-items:center;padding:0 20px;gap:22px;position:sticky;top:0;z-index:3}.brand{font-size:20px;font-weight:700}.tabs{display:flex;gap:6px}.tabs button,.secondary{border:0;background:#24334b;color:#dce6f4;padding:10px 13px;border-radius:7px;cursor:pointer}.tabs button.on,.primary{background:#2863db;color:white}.status{margin-left:auto;font-size:12px;color:#a3b1c7}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 60px)}aside{padding:17px;background:#0e1728;border-right:1px solid #293750;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto}.content{padding:20px;max-width:1550px;width:100%;margin:auto;min-width:0}.field{margin:0 0 12px}.field label{display:block;font-size:12px;color:#aab8cc;margin-bottom:5px}.field input,.field select{width:100%;background:#17233a;color:#edf3fb;border:1px solid #374663;border-radius:6px;padding:8px}.field input[type=checkbox]{width:auto}.field button,.primary{width:100%;border:0;border-radius:7px;padding:10px;cursor:pointer;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.metric,.panel{background:#111b2e;border:1px solid #293750;border-radius:9px;padding:13px}.metric label{display:block;color:#9daec5;font-size:12px;margin-bottom:7px}.metric strong{font-size:21px}.metric em{display:block;color:#7bd5a8;font-style:normal;font-size:12px;margin-top:4px}.notice{padding:10px 12px;background:#173154;border:1px solid #2c5484;border-radius:7px;margin:8px 0}.notice.warning{background:#3a2d17;border-color:#765820}.notice.error{background:#3a2025;border-color:#7c3941}.table-wrap{overflow:auto;border:1px solid #293750;border-radius:8px;margin:10px 0 18px}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #293750}th{background:#1a2942;color:#bdcbe0}tr:last-child td{border:0}.chart{height:370px;background:#111b2e;border-radius:9px;margin:10px 0 20px}.section{font-size:17px;margin:23px 0 9px}.caption{font-size:12px;color:#96a6bd;line-height:1.5}.hidden{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid #293750}.content{padding:13px}.status{display:none}}
:root{color-scheme:light;color:#172033;background:#fff}body{background:#fff;color:#172033}.top{background:#fff;border-color:#e2e8f0;box-shadow:0 2px 8px #1720330a}.brand{color:#111827}.tabs button{background:#eef2f7;color:#334155}.tabs button.on{background:#2563eb;color:#fff}.secondary{background:#e8edf4;color:#273449}.status,.caption{color:#64748b}aside{background:#f8fafc;border-color:#e2e8f0}.field label{color:#475569}.field input,.field select{background:#fff;color:#172033;border-color:#cbd5e1}.field input:focus,.field select:focus{outline:2px solid #93c5fd;border-color:#3b82f6}.metric,.panel{background:#fff;border-color:#e2e8f0;box-shadow:0 2px 6px #0f172a08}.metric label{color:#64748b}.metric strong{color:#0f172a}.metric em{color:#15803d}.notice{background:#eff6ff;border-color:#bfdbfe;color:#1e3a5f}.notice.warning{background:#fffbeb;border-color:#fde68a;color:#713f12}.notice.error{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}.table-wrap{border-color:#e2e8f0;background:#fff}th,td{border-color:#e2e8f0;color:#1f2937}th{background:#f1f5f9;color:#334155}.chart{background:#fff}.section{color:#172033}a{color:#1d4ed8}.read-only .layout{grid-template-columns:minmax(0,1fr)}.read-only aside,.read-only #nav-news{display:none}
</style></head><body>
<header class="top"><strong class="brand">StockTrader</strong><nav class="tabs"><button id="nav-dash" class="on" onclick="showTab('dash')">Trading dashboard</button><button id="nav-news" onclick="showTab('news')">Article sentiment</button></nav><span id="status" class="status">Loading…</span></header>
<section id="dash" class="layout"><aside><h3>Settings</h3><div id="controls"></div><div class="field"><label for="manual-symbols">Fallback symbols, comma separated</label><input id="manual-symbols" placeholder="NVDA, AAPL, MSFT"></div><div class="field"><label><input id="arm" type="checkbox"> Allow automatic orders after Start</label></div><div class="field"><label><input id="ack" type="checkbox"> I understand this sends real Production orders</label></div><div class="field"><label for="phrase">Type ENABLE LIVE TRADING</label><input id="phrase" type="password" autocomplete="off"></div><div class="field"><button class="primary" onclick="action('connect')">Connect / refresh account</button></div><div class="field"><button class="primary" onclick="action('start')">Start automation</button></div><div class="field"><button class="secondary" onclick="action('stop')">Stop automation</button></div><div class="field"><button class="secondary" onclick="action('refresh')">Refresh now</button></div><p class="caption">Production automation starts only after explicit authorization and the live-trading confirmation.</p></aside><main id="dashboard" class="content"></main></section>
<section id="news" class="content hidden"><h1>Article sentiment</h1><p class="caption">Yahoo Finance headlines and snippets scored locally with FinBERT. Recent, confident sentiment prioritizes aligned HalfTrend signals.</p><div class="panel" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><div class="field" style="flex:2;min-width:230px"><label>Stocks to analyze</label><select id="news-symbols" multiple size="8" style="width:100%"></select></div><div class="field"><label>Articles per stock</label><input id="count" type="number" value="3" min="1" max="8"></div><div class="field"><label>Lookback days</label><input id="days" type="number" value="7" min="1" max="30"></div><div class="field"><button class="primary" onclick="runSentiment()">Measure sentiment</button></div></div><div id="news-result"></div></section>
<script>
let state=null,activeTab='dash';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showTab(n){activeTab=n;document.getElementById('dash').classList.toggle('hidden',n!=='dash');document.getElementById('news').classList.toggle('hidden',n!=='news');document.getElementById('nav-dash').classList.toggle('on',n==='dash');document.getElementById('nav-news').classList.toggle('on',n==='news');if(n==='news')loadSymbols()}
function buildControls(){let defs=[['environment','Environment','select',['Sandbox','Production'],'Sandbox'],['interval','Candlestick interval','select',['1m','5m','15m','30m','60m'],'1m'],['period','Yahoo history','select',['7d','5d','30d','60d'],'7d'],['amplitude','HalfTrend amplitude','number',1,10,2],['channel_deviation','ATR channel deviation','number',0,10,2],['initial_capital','Simulator starting capital ($)','number',1,100000,500],['sim_allocation_pct','Simulator allocation (%)','number',1,100,20],['allocation_pct','Max account equity per position (%)','number',1,25,5],['max_portfolio_pct','Max total exposure (%)','number',10,100,50],['max_order_notional','Maximum notional per order ($)','number',25,10000,100],['max_gap_pct','Max quote / signal gap (%)','number',.1,5,.5],['daily_loss_pct','Pause new entries after daily loss (%)','number',.5,10,2]];let root=document.getElementById('controls');defs.forEach(d=>{let w=document.createElement('div');w.className='field';let l=document.createElement('label');l.textContent=d[1];w.appendChild(l);let e=document.createElement(d[2]==='select'?'select':'input');e.id='cfg-'+d[0];if(d[2]==='select')d[3].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;e.appendChild(o)});else{e.type='number';e.min=d[3];e.max=d[4];e.step=(d[0].includes('pct')||d[0]==='channel_deviation')?'.1':'1';e.value=d[5]}w.appendChild(e);root.appendChild(w)});document.getElementById('cfg-environment').onchange=()=>{saveSettings(); refresh(); renderCore();}}
function settings(){let s={};document.querySelectorAll('#controls input,#controls select').forEach(e=>{s[e.id.slice(4)]=e.type==='number'?Number(e.value):e.value});s.symbols=document.getElementById('manual-symbols').value.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);try{localStorage.setItem('stocktrader-settings',JSON.stringify(s))}catch(e){}return s}
async function call(url,body){let r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function action(name){try{let r=await call('/api/controls',{settings:settings(),action:name,arm:document.getElementById('arm').checked,production_ack:document.getElementById('ack').checked,live_phrase:document.getElementById('phrase').value});document.getElementById('phrase').value='';render(r.snapshot)}catch(e){alert(e.message)}}
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}function pct(v){return Number(v||0).toFixed(2)+'%'}function metric(n,v,sub=''){return '<div class="metric"><label>'+esc(n)+'</label><strong>'+esc(v)+'</strong>'+(sub?'<em>'+esc(sub)+'</em>':'')+'</div>'}
function table(title,rows){let h='<h3 class="section">'+esc(title)+'</h3>';if(!rows||!rows.length)return h+'<p class="caption">No data available.</p>';let keys=Object.keys(rows[0]);return h+'<div class="table-wrap"><table><thead><tr>'+keys.map(k=>'<th>'+esc(k.replaceAll('_',' '))+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(typeof r[k]==='object'&&r[k]!==null?JSON.stringify(r[k]):r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function lineChart(id,title,rows){if(!rows||!rows.length)return '<h3 class="section">'+esc(title)+'</h3><p class="caption">No history recorded yet.</p>';let min=(document.getElementById('equity-start')?.value||'');if(min)rows=rows.filter(x=>String(x.time).slice(0,10)>=min);setTimeout(()=>Plotly.newPlot(id,[{x:rows.map(x=>x.time),y:rows.map(x=>x.value),type:'scatter',mode:'lines',line:{color:'#2563eb'}}],{title,paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{color:'#172033'},margin:{t:45,l:55,r:20,b:40},xaxis:{gridcolor:'#e2e8f0'},yaxis:{gridcolor:'#e2e8f0',tickprefix:'$'}},{responsive:true,displaylogo:false}),0);return '<h3 class="section">'+esc(title)+'</h3><div id="'+id+'" class="chart"></div>'}
function render(d){state=d;let status=(d.environment||'')+' · '+(d.automation?'AUTOMATION ON':'Automation off')+' · '+(d.refreshed_at||'');document.getElementById('status').textContent=status;let html=(d.warnings||[]).map(x=>'<div class="notice warning">'+esc(x)+'</div>').join('');if(d.last_error)html+='<div class="notice error">'+esc(d.last_error)+'</div>';if(d.environment==='Sandbox'){let s=d.simulator||{};html+='<h2>Sandbox simulator</h2><div class="metrics">'+metric('Daily profit',money(s.daily_profit),pct(s.daily_profit_pct))+metric('Total profit',money(s.total_profit),pct(s.total_profit_pct))+metric('Virtual equity',money((s.initial_capital||0)+(s.total_profit||0)))+metric('Open positions',(d.positions||[]).length)+'</div>'+table('Simulator positions',d.positions||[])+lineChart('equity-chart','Sandbox equity over time',s.equity||[])}else{html+='<h2>Production account</h2><div class="metrics">'+metric('Net liquidation value',money(d.net_liquidation_value))+metric('Cash',money(d.cash))+metric('Open positions',(d.positions||[]).length)+metric('Automation',d.automation?'RUNNING':'OFF')+'</div>'+table('Current holdings',d.positions||[])+lineChart('equity-chart','Production equity over time',d.equity||[])+table('Signal and order activity',d.events||[])}html+=table('Latest HalfTrend signals',d.signals||[]);let syms=(d.signals||[]).map(x=>x.symbol);if(syms.length)html+='<div class="field"><label for="chart-symbol">Chart symbol</label><select id="chart-symbol">'+syms.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></div><div id="stock-chart" class="chart"></div>';document.getElementById('dashboard').innerHTML=html;if(syms.length){let el=document.getElementById('chart-symbol');el.onchange=()=>drawStock(el.value);drawStock(el.value)}}
function drawStock(sym){let b=state?.bars?.[sym];if(!b)return;Plotly.newPlot('stock-chart',[{x:b.time,open:b.open,high:b.high,low:b.low,close:b.close,type:'candlestick',name:sym},{x:b.time,y:b.halftrend,type:'scatter',mode:'lines',name:'HalfTrend',line:{color:'#d97706',width:2}},{x:b.time,y:b.buy,type:'scatter',mode:'markers',name:'BUY',marker:{color:'#16a34a',symbol:'triangle-up',size:10}},{x:b.time,y:b.sell,type:'scatter',mode:'markers',name:'SELL',marker:{color:'#dc2626',symbol:'triangle-down',size:10}}],{title:sym+' · HalfTrend',paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{color:'#172033'},margin:{t:45,l:50,r:15,b:35},xaxis:{rangeslider:{visible:false},gridcolor:'#e2e8f0'},yaxis:{gridcolor:'#e2e8f0'}},{responsive:true,displaylogo:false})}
const renderAccess=render;render=function(d){document.body.classList.toggle('read-only',d.access_mode==='view-only');renderAccess(d);if(d.access_mode==='view-only')document.getElementById('dashboard').insertAdjacentHTML('afterbegin','<div class="notice">Network view-only access. Trading settings and sentiment runs are available on the StockTrader host.</div>')};
const renderCore=render;render=function(d){renderCore(d);let root=document.getElementById('dashboard');if(d.environment==='Sandbox'){root.insertAdjacentHTML('beforeend',table('Daily simulated realized profit',d.simulator?.daily||[])+table('Recent simulator trade log',d.simulator?.trades||[]))}else{let area=root.querySelector('.metrics');if(area)area.insertAdjacentHTML('beforeend',metric('Profit since app start',money(d.profit_since_start),d.account_number||''))}};
async function refresh(){try{render(await call('/api/state'))}catch(e){document.getElementById('status').textContent=e.message}}
async function loadSymbols(){let el=document.getElementById('news-symbols');if(el.options.length)return;try{let d=await call('/api/sentiment/universe');d.symbols.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;o.selected=true;el.appendChild(o)})}catch(e){document.getElementById('news-result').textContent=e.message}}
async function runSentiment(){let root=document.getElementById('news-result');root.textContent='Fetching articles and scoring with FinBERT…';try{let d=await call('/api/sentiment',{symbols:[...document.getElementById('news-symbols').selectedOptions].map(x=>x.value),per_symbol:+document.getElementById('count').value,lookback_days:+document.getElementById('days').value});let rows=d.articles;let summary=table('Average sentiment by stock',d.summary||[]);let err=d.scoring_error?'<div class="notice warning">Articles were fetched, but FinBERT scoring failed: '+esc(d.scoring_error)+'</div>':'';root.innerHTML='<div class="metrics">'+metric('Articles fetched',rows.length)+metric('Stocks saved for strategy ranking',d.saved_symbols)+'</div>'+err+summary+table('Article measurements',rows)+(d.fetch_errors||[]).map(x=>'<div class="notice warning">'+esc(x)+'</div>').join('')}catch(e){root.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
let settingsTimer;
async function saveSettings(){try{await call('/api/settings',{settings:settings()})}catch(e){document.getElementById('status').textContent='Settings not saved · '+e.message}}
async function init(){buildControls();document.getElementById('controls').insertAdjacentHTML('beforeend','<div class="field"><label for="equity-start">Equity chart start date</label><input id="equity-start" type="date"></div>');try{let saved=JSON.parse(localStorage.getItem('stocktrader-settings')||'{}');Object.keys(saved).forEach(k=>{let e=document.getElementById('cfg-'+k);if(e)e.value=saved[k];else if(k==='symbols')document.getElementById('manual-symbols').value=saved[k].join(', ')});document.getElementById('equity-start').value=localStorage.getItem('stocktrader-equity-start')||''}catch(e){}document.getElementById('equity-start').onchange=e=>{localStorage.setItem('stocktrader-equity-start',e.target.value);state&&render(state)};document.querySelectorAll('#controls input,#controls select').forEach(e=>e.addEventListener('input',()=>{clearTimeout(settingsTimer);settingsTimer=setTimeout(saveSettings,500)}));document.querySelectorAll('#controls select,#manual-symbols').forEach(e=>e.addEventListener('change',()=>{clearTimeout(settingsTimer);settingsTimer=setTimeout(saveSettings,150)}));document.getElementById('manual-symbols').addEventListener('input',()=>{clearTimeout(settingsTimer);settingsTimer=setTimeout(saveSettings,500)});await refresh()}init();setInterval(()=>{if(activeTab==='dash')refresh()},60000);
</script></body></html>
